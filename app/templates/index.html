<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma to Dashboard Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loader.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            display: none;
        }
        
        .result.active {
            display: block;
        }
        
        .summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .summary h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .summary-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        
        .summary-item strong {
            display: block;
            color: #667eea;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .summary-item span {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }
        
        .config-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .config-content {
            display: none;
        }
        
        .config-content.active {
            display: block;
        }
        
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c33;
            display: none;
        }
        
        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 Figma to Dashboard Generator</h1>
            <p>AI-powered tool to convert Figma designs into dashboard configurations</p>
        </div>
        
        <div class="card">
            <div class="input-group">
                <label for="figmaUrl">Figma File URL</label>
                <input 
                    type="text" 
                    id="figmaUrl" 
                    placeholder="https://www.figma.com/file/..."
                    value=""
                >
            </div>
            
            <button class="btn" id="convertBtn" onclick="convertFigma()">
                Convert to Dashboard Config
            </button>
            
            <div class="error" id="errorMsg"></div>
        </div>
        
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: white; font-weight: 600;">Processing your design...</p>
        </div>
        
        <div class="card result" id="result">
            <h2 style="margin-bottom: 20px;">Results</h2>
            
            <div class="summary">
                <h3>Summary</h3>
                <div class="summary-grid" id="summaryGrid"></div>
            </div>
            
            <div class="config-tabs">
                <button class="tab active" onclick="showTab('json')">JSON Config</button>
                <button class="tab" onclick="showTab('yaml')">YAML Config</button>
            </div>
            
            <div class="config-content active" id="jsonContent">
                <pre id="jsonOutput"></pre>
            </div>
            
            <div class="config-content" id="yamlContent">
                <pre id="yamlOutput"></pre>
            </div>
        </div>
    </div>
    
    <script>
        let currentTab = 'json';
        
        function showTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update content
            document.querySelectorAll('.config-content').forEach(content => {
                content.classList.remove('active');
            });
            
            if (tab === 'json') {
                document.getElementById('jsonContent').classList.add('active');
            } else {
                document.getElementById('yamlContent').classList.add('active');
            }
        }
        
        async function convertFigma() {
            const url = document.getElementById('figmaUrl').value.trim();
            const loader = document.getElementById('loader');
            const result = document.getElementById('result');
            const error = document.getElementById('errorMsg');
            const btn = document.getElementById('convertBtn');
            
            // Reset states
            error.classList.remove('active');
            result.classList.remove('active');
            
            if (!url) {
                error.textContent = 'Please enter a Figma URL';
                error.classList.add('active');
                return;
            }
            
            // Show loader
            loader.classList.add('active');
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ figma_url: url })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Conversion failed');
                }
                
                // Display summary
                const summary = data.summary;
                const summaryGrid = document.getElementById('summaryGrid');
                summaryGrid.innerHTML = `
                    <div class="summary-item">
                        <strong>Total Components</strong>
                        <span>${summary.total_components}</span>
                    </div>
                    <div class="summary-item">
                        <strong>Canvas Size</strong>
                        <span>${Math.round(summary.canvas_size.width)}×${Math.round(summary.canvas_size.height)}</span>
                    </div>
                `;
                
                // Add component type counts
                for (const [type, count] of Object.entries(summary.component_types)) {
                    summaryGrid.innerHTML += `
                        <div class="summary-item">
                            <strong>${type.replace('_', ' ').toUpperCase()}</strong>
                            <span>${count}</span>
                        </div>
                    `;
                }
                
                // Display configs
                document.getElementById('jsonOutput').textContent = data.config_json;
                document.getElementById('yamlOutput').textContent = data.config_yaml;
                
                // Show results
                result.classList.add('active');
                
            } catch (err) {
                error.textContent = err.message;
                error.classList.add('active');
            } finally {
                loader.classList.remove('active');
                btn.disabled = false;
            }
        }
        
        // Allow Enter key to submit
        document.getElementById('figmaUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                convertFigma();
            }
        });
    </script>
</body>
</html>
